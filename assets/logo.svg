<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Discord Thread Router</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(1.12) translate(-520 -495)">
    <!-- the Discord thread: a chat bubble -->
    <rect x="170" y="380" width="300" height="230" rx="62" fill="#FFFFFF"/>
    <path d="M226 590 L204 694 L312 604 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="255" cy="495" r="25" fill="#3730A3"/>
    <circle cx="320" cy="495" r="25" fill="#3730A3"/>
    <circle cx="385" cy="495" r="25" fill="#3730A3"/>
    <!-- the router: one line in, three out -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="30">
      <path d="M470 495 H560"/>
      <path d="M570 495 C 625 495, 620 330, 690 330"/>
      <path d="M570 495 H690"/>
      <path d="M570 495 C 625 495, 620 660, 690 660"/>
    </g>
    <circle cx="570" cy="495" r="40" fill="#FFFFFF"/>
    <circle cx="570" cy="495" r="17" fill="#F59E0B"/>
    <!-- the kanban cards -->
    <rect x="680" y="275" width="190" height="110" rx="26" fill="#FFFFFF" fill-opacity="0.92"/>
    <rect x="680" y="440" width="190" height="110" rx="26" fill="#F59E0B"/>
    <rect x="680" y="605" width="190" height="110" rx="26" fill="#FFFFFF" fill-opacity="0.92"/>
    <g stroke-linecap="round" stroke-width="18">
      <path d="M714 315 H830" stroke="#3730A3" stroke-opacity="0.55"/>
      <path d="M714 347 H786" stroke="#3730A3" stroke-opacity="0.35"/>
      <path d="M714 480 H830" stroke="#FFFFFF"/>
      <path d="M714 512 H786" stroke="#FFFFFF" stroke-opacity="0.75"/>
      <path d="M714 645 H830" stroke="#3730A3" stroke-opacity="0.55"/>
      <path d="M714 677 H786" stroke="#3730A3" stroke-opacity="0.35"/>
    </g>
  </g>
</svg>
