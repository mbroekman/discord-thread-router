services:
  discord-bot:
    build: .
    container_name: github-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RULES_FILE: /app/config/rules.yaml
    volumes:
      # Edit config/rules.yaml on the host; the bot picks up changes without a restart.
      # (A folder, not a single file: editors replace the file, which a file mount would miss.)
      - ./config:/app/config:ro
